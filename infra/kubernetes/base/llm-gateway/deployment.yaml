apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  labels:
    app.kubernetes.io/name: llm-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-gateway
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llm-gateway
          image: opensoftwarefactory-llm-gateway:local
          imagePullPolicy: Never
          args:
            - -config
            - /config/config.yaml
            - -logs
            - /logs
          env:
            - name: EVALUATION_URL
              value: http://evaluation:8080
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://telemetry-collector:4318/v1/traces
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: logs
              mountPath: /logs
      volumes:
        - name: config
          hostPath:
            path: /llm-gateway/config
            type: Directory
        - name: logs
          hostPath:
            path: /llm-gateway/logs
            type: Directory
