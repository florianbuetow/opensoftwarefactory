apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  labels:
    app.kubernetes.io/name: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          # Runs pinned agent definitions against the LLM gateway on task queue "agent".
          image: opensoftwarefactory-agent:local
          imagePullPolicy: Never
          env:
            - name: EVALUATION_URL
              value: http://evaluation:8080
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
            - name: BLOB_URL
              value: http://blobstore:8080/blobs
            - name: AGENT_REGISTRY_URL
              value: http://agent-registry:8080
            - name: POLICY_REGISTRY_URL
              value: http://policy-registry:8080
            - name: SKILL_REGISTRY_URL
              value: http://skill-registry:8080
            - name: LLM_URL
              value: http://llm-gateway:8080/v1
            - name: MCP_GATEWAY_URL
              value: http://mcp-gateway:8080
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://telemetry-collector:4318/v1/traces
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
