apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation
  labels:
    app.kubernetes.io/name: evaluation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: evaluation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evaluation
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: evaluation
          image: opensoftwarefactory-evaluation:local
          imagePullPolicy: Never
          env:
            - name: EVALUATION_LOCK_PATH
              value: /state/writer.lock
            - name: OPENOBSERVE_URL
              value: http://openobserve:5080
            - name: OPENOBSERVE_CONFIG
              value: /openobserve/config/openobserve.env
            - name: BLOBSTORE_URL
              value: http://blobstore:8080
            - name: ORCHESTRATOR_URL
              value: http://orchestrator:8080
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://telemetry-collector:4318/v1/traces
          volumeMounts:
            - name: state
              mountPath: /state
            - name: observe-config
              mountPath: /openobserve/config
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 300m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: state
          hostPath:
            path: /var/lib/opensoftwarefactory/evaluation
            type: Directory
        - name: observe-config
          hostPath:
            path: /openobserve/config
            type: Directory
