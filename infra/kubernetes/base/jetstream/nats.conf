server_name: factory-events
port: 4222
http_port: 8222
jetstream {
  store_dir: /data
  sync_interval: always
}
authorization {
  users: [
    {
      user: $NATS_PUBLISHER_USER
      password: $NATS_PUBLISHER_PASSWORD
      permissions: {
        publish: ["factory.workflow.started", "factory.workflow.finished", "$JS.API.INFO", "$JS.API.STREAM.INFO.FACTORY_WORKFLOW_EVENTS", "$JS.API.STREAM.CREATE.FACTORY_WORKFLOW_EVENTS", "$JS.API.STREAM.UPDATE.FACTORY_WORKFLOW_EVENTS"]
        subscribe: ["_INBOX.>"]
      }
    },
    {
      user: $NATS_CONSUMER_USER
      password: $NATS_CONSUMER_PASSWORD
      permissions: {
        publish: ["$JS.API.INFO", "$JS.API.STREAM.INFO.FACTORY_WORKFLOW_EVENTS", "$JS.API.STREAM.MSG.GET.FACTORY_WORKFLOW_EVENTS", "$JS.API.CONSUMER.*.FACTORY_WORKFLOW_EVENTS.>", "$JS.API.CONSUMER.DURABLE.CREATE.FACTORY_WORKFLOW_EVENTS.>", "$JS.API.CONSUMER.MSG.NEXT.FACTORY_WORKFLOW_EVENTS.>", "$JS.ACK.FACTORY_WORKFLOW_EVENTS.>"]
        subscribe: ["_INBOX.>"]
      }
    }
  ]
}
