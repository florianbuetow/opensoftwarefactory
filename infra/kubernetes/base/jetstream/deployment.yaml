apiVersion: apps/v1
kind: Deployment
metadata:
  name: jetstream
  labels:
    app.kubernetes.io/name: jetstream
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jetstream
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jetstream
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: jetstream
          image: nats:2.15.3-alpine
          args: ["-c", "/config/nats.conf"]
          envFrom:
            - secretRef:
                name: factory-events-server
          ports:
            - name: nats
              containerPort: 4222
            - name: health
              containerPort: 8222
          readinessProbe:
            httpGet: { path: "/healthz?js-enabled-only=true", port: health }
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: data
          hostPath:
            path: /var/lib/opensoftwarefactory/jetstream
            type: Directory
        - name: config
          configMap:
            name: jetstream-config
