apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-registry
  labels:
    app.kubernetes.io/name: policy-registry
spec:
  replicas: 1
  # Version numbers are allocated in process; keep a single writer.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: policy-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: policy-registry
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: policy-registry
          # The same registry image as agent-registry, serving policies.
          image: opensoftwarefactory-registry:local
          imagePullPolicy: Never
          args:
            - -seed
            - /seed-root/current/registry/policies
            - -prefix
            - policies
            - -files
            - policy.md
          env:
            - name: OTEL_SERVICE_NAME
              value: policy-registry
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://telemetry-collector:4318/v1/traces
            - name: BLOBSTORE_URL
              value: http://blobstore:8080
          volumeMounts:
            - name: local-seeds
              mountPath: /seed-root
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: local-seeds
          hostPath:
            path: /var/lib/opensoftwarefactory/seeds
            type: Directory
