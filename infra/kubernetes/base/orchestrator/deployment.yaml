apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  labels:
    app.kubernetes.io/name: orchestrator
spec:
  replicas: 1
  # The orchestrator keeps the stored workflows in memory and is their only writer.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchestrator
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: opensoftwarefactory-orchestrator:local
          imagePullPolicy: Never
          args: ["-seed", "/seed-root/current/orchestrator"]
          envFrom:
            - secretRef:
                name: factory-events-publisher
          env:
            - name: EVALUATION_URL
              value: http://evaluation:8080
            - name: NATS_URL
              value: nats://jetstream:4222
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
            - name: BLOB_URL
              value: http://blobstore:8080/blobs
            - name: AGENT_URL
              value: http://agent:8080
            - name: SKILL_REGISTRY_URL
              value: http://skill-registry:8080
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://telemetry-collector:4318/v1/traces
          volumeMounts:
            - name: local-seeds
              mountPath: /seed-root
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: local-seeds
          hostPath:
            path: /var/lib/opensoftwarefactory/seeds
            type: Directory
