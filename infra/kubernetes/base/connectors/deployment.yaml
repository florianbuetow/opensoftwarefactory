apiVersion: apps/v1
kind: Deployment
metadata:
  name: connectors
  labels:
    app.kubernetes.io/name: connectors
spec:
  replicas: 1
  # The service keeps the dev pods' state in memory, so two must never run side by side.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: connectors
  template:
    metadata:
      labels:
        app.kubernetes.io/name: connectors
    spec:
      serviceAccountName: connectors
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connectors
          image: opensoftwarefactory-connectors:local
          imagePullPolicy: Never
          env:
            - name: BLOBSTORE_URL
              value: http://blobstore:8080
            - name: AGENT_REGISTRY_URL
              value: http://agent-registry:8080
            - name: MCP_GATEWAY_URL
              value: http://mcp-gateway:8080
            - name: DEVPOD_NAMESPACE
              value: opensoftwarefactory-devpods
            - name: DEVPOD_IMAGE
              value: opensoftwarefactory-devpod:local
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://telemetry-collector:4318/v1/traces
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 300m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
