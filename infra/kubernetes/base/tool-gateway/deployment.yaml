apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-gateway
  labels:
    app.kubernetes.io/name: tool-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tool-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tool-gateway
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tool-gateway
          image: opensoftwarefactory-tool-gateway:local
          imagePullPolicy: Never
          env:
            - name: EVALUATION_URL
              value: http://evaluation:8080
            - name: PORT
              value: "8080"
            - name: TOOLS_PATH
              value: /tools/tools.py
            - name: BLOBSTORE_URL
              value: http://blobstore:8080
            - name: POLICY_REGISTRY_URL
              value: http://policy-registry:8080
            - name: CONNECTORS_URL
              value: http://connectors:8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # The host-mounted tools file; editing it restarts the process.
            - name: tools
              mountPath: /tools
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tools
          hostPath:
            path: /tool-gateway/tools
            type: Directory
        - name: tmp
          emptyDir: {}
