[project]
name = "tool-gateway"
version = "0.1.0"
description = "MCP server that exposes host-editable tools to factory agents."
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0,<3",
    "mcp-types>=2.3.0,<3",
    "starlette>=1.10.0,<2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
